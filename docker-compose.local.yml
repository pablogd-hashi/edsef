services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memoria
      POSTGRES_PASSWORD: memoria_dev
      POSTGRES_DB: memoria
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoria -d memoria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
