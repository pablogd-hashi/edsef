version: "3"

vars:
  COMPOSE_FILE: docker-compose.local.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: First-time setup — .env, Docker, deps, migrations
    cmds:
      - task: env
      - task: db:up
      - npm install
      - npm run db:migrate:deploy
      - mkdir -p storage
      - echo ""
      - echo "Ready. Run  task up  then open http://localhost:3000/register"

  env:
    desc: Create .env from .env.example if missing
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - echo "Created .env from .env.example"

  up:
    desc: Start Postgres + Redis and Next.js dev server
    deps:
      - db:up
    cmds:
      - npm run dev

  dev:
    desc: Alias for up — start DB and Next.js dev server
    cmds:
      - task: up

  db:up:
    desc: Start only Postgres + Redis
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait
      - docker compose -f {{.COMPOSE_FILE}} ps

  down:
    desc: Stop Postgres + Redis
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  logs:
    desc: Tail Docker service logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f --tail 50

  ps:
    desc: Show Docker service status
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  migrate:
    desc: Apply database migrations
    cmds:
      - npm run db:migrate:deploy

  db:status:
    desc: Check if database is reachable
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps
      - curl -s http://localhost:3000/api/ping || true

  reset-db:
    desc: Wipe database volume and re-run migrations (destructive)
    prompt: This deletes all local database data. Continue?
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v
      - task: setup
