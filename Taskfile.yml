version: "3"

vars:
  COMPOSE_FILE: docker-compose.local.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: First-time setup — .env, Docker, deps, migrations
    cmds:
      - task: env
      - task: db:up
      - npm install
      - npm run db:migrate:deploy
      - mkdir -p storage
      - echo ""
      - echo "Ready. Run  task up  (family server) then open http://localhost:3000/register"

  env:
    desc: Create .env from .env.example if missing
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - echo "Created .env from .env.example"

  lan:serve:
    desc: Production build + LAN server (alias for task up)
    cmds:
      - task: up

  phone:
    desc: Alias for up — family server for iPhone + daily use
    cmds:
      - task: up

  dev:
    desc: Dev server with hot reload (Mac coding only — flickers on iPhone)
    deps:
      - db:up
    cmds:
      - echo ""
      - echo "Dev mode — for coding on the Mac. iPhone should use  task up  instead."
      - echo ""
      - npm run dev

  dev:only:
    desc: Next.js dev only (when Docker is already running)
    cmds:
      - npm run dev

  doctor:
    desc: Check Node, port 3000, Docker, and common dev issues
    cmds:
      - bash scripts/doctor.sh

  relocate:
    desc: Copy project out of iCloud Documents to ~/Developer
    cmds:
      - bash scripts/relocate-from-icloud.sh

  up:
    desc: Family server — production mode on LAN (default; stable on iPhone)
    cmds:
      - bash scripts/family-serve.sh

  db:up:
    desc: Start only Postgres
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait
      - docker compose -f {{.COMPOSE_FILE}} ps

  down:
    desc: Stop Postgres
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  logs:
    desc: Tail Docker service logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f --tail 50

  ps:
    desc: Show Docker service status
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps

  inbox:
    desc: Poll the iCloud Drive inbox and import new photos
    cmds:
      - npm run inbox:watch

  migrate:
    desc: Apply database migrations
    cmds:
      - npm run db:migrate:deploy

  db:status:
    desc: Check if database is reachable
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} ps
      - curl -s http://localhost:3000/api/ping || true

  reset-db:
    desc: Wipe database volume and re-run migrations (destructive)
    prompt: This deletes all local database data. Continue?
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down -v
      - task: setup
